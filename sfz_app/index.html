<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salesforce-Zertifizierungs-Trainer</title>
  <script>
    try {
      const raw = localStorage.getItem("salesforce-trainer-settings") ?? localStorage.getItem("sfz-app-settings");
      const theme = raw && JSON.parse(raw)?.theme;
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#app">Zum Inhalt springen</a>

  <header class="app-header">
    <div class="app-title">Salesforce-Zertifizierungs-Trainer</div>
    <button id="nav-toggle" class="nav-toggle secondary-btn" type="button" aria-controls="nav" aria-expanded="false" hidden>Menü</button>
    <nav id="nav" class="app-nav" aria-label="Hauptnavigation"></nav>
  </header>

  <noscript>JavaScript wird zum Laden der Lerninhalte benötigt.</noscript>

  <main id="app" class="app-main" tabindex="-1">
    <p>Wenn der Trainer hier stehen bleibt, öffne ihn über das lokale Startskript.</p>
  </main>

  <footer class="app-footer">
    <p>Lokale Lern-App · Platform Foundations &amp; Platform Administrator · Alle Übungsinhalte sind synthetisch und keine Originalprüfungsfragen.</p>
    <p class="app-footer-credit">M. Pönisch · 08/2026</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
